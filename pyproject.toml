[project]
name = "jordannedyck-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=2.0",
    "flask-cors>=3.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.20",
    "openai>=1.0",
    "python-dotenv>=0.19",
    "pyyaml>=6.0",
]

[tool.ruff]
# One-off probe and test scripts, plus the dead ChromaDB readers. Not maintained, so not linted.
extend-exclude = [
    "mcp_server/",
    "scripts/embed_knowledge.py",
    "test_*.py",
    "dump_candidates.py",
    "selftest.py",
]
